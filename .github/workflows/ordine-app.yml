name: La tua sala - ordine dall'app

# L'app apre una "issue" già compilata (titolo: ORDINE BTC LONG 100). Basta premere "Submit new issue".
# Solo il proprietario del repository può dare ordini: le issue di altri vengono ignorate.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: desk-ia
  cancel-in-progress: false

jobs:
  ordine:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'ORDINE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registra l'ordine
        id: ordine
        env:
          TITOLO: ${{ github.event.issue.title }}
          NOTA: ${{ github.event.issue.body }}
        run: node order.js | tee esito.txt

      - name: Aggiorna il desk
        run: node desk.js

      - name: Salva
        env:
          TITOLO: ${{ github.event.issue.title }}
        run: |
          git config user.name "desk-ia-bot"
          git config user.email "desk-ia-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "$TITOLO"
          git pull --rebase
          git push

      - name: Rispondi e chiudi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ job.status }}
        run: |
          if [ "$OK" = "success" ]; then MSG="✅ $(cat esito.txt). Verrà eseguito alla prima chiusura di mercato: lo vedi nella tua sala dell'app tra un paio di minuti."; else MSG="❌ Ordine non valido o errore. Scrivi il titolo come: ORDINE BTC LONG 100 (mercato: BTC, NDX, EURUSD · posizione: LONG, SHORT, FLAT · quota: 25, 50, 75, 100)."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
