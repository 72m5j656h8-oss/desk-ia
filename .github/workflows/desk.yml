name: Desk IA - giro giornaliero

on:
  schedule:
    - cron: "23 0 * * *"     # ogni giorno alle 00:23 UTC, dopo la chiusura di tutti i mercati
  workflow_dispatch: {}        # pulsante "Run workflow" per un giro a mano

permissions:
  contents: write

concurrency:
  group: desk-ia
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Giro del desk
        run: node desk.js

      - name: Salva i risultati
        run: |
          git config user.name "desk-ia-bot"
          git config user.email "desk-ia-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Giro del desk $(date -u +'%Y-%m-%d') UTC"
            git pull --rebase
            git push
          fi
