name: debug
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: desk-ia, cancel-in-progress: false }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node -e "
          (async()=>{const out={};for(const [s,q] of [['SPY','period1=0'],['SPY','period1='+(Math.floor(Date.now()/1000)-40*86400)],['BTC-USD','period1='+(Math.floor(Date.now()/1000)-40*86400)],['^NDX','period1='+(Math.floor(Date.now()/1000)-40*86400)]]){
            const p2=Math.floor(Date.now()/1000)+86400;const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(s)+'?'+q+'&period2='+p2+'&interval=1d&events=div,split',{headers:{'User-Agent':'Mozilla/5.0 (desk-ia)'}});const j=await r.json();const x=j.chart.result[0];
            out[s+' '+q.slice(0,10)]={ts:x.timestamp.slice(-3).map(t=>new Date(t*1000).toISOString()),close:x.indicators.quote[0].close.slice(-3),adj:x.indicators.adjclose&&x.indicators.adjclose[0].adjclose.slice(-3),meta:{t:x.meta.regularMarketTime,p:x.meta.regularMarketPrice,off:x.meta.gmtoffset,gran:x.meta.dataGranularity,range:x.meta.range}}}
          require('fs').writeFileSync('docs/data/debug.json',JSON.stringify(out,null,1))})()"
          git config user.name bot; git config user.email bot@x; git add docs/data/debug.json; git commit -m debug; git pull --rebase; git push
