name: Sala DAX - giro giornaliero

on:
  schedule:
    - cron: "47 5 * * 2-6"   # dal martedi al sabato alle 05:47 UTC: elabora la giornata di ieri
  workflow_dispatch: {}        # pulsante "Run workflow" per un giro a mano

permissions:
  contents: write

concurrency:
  group: desk-ia
  cancel-in-progress: false

jobs:
  dax:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prezzi DAX (Dukascopy)
        run: npm install --no-save --no-package-lock dukascopy-node

      - name: Giro della sala DAX
        run: node dax.js

      - name: Salva i risultati
        run: |
          git config user.name "desk-ia-bot"
          git config user.email "desk-ia-bot@users.noreply.github.com"
          git add docs/data/dax
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Sala DAX $(date -u +'%Y-%m-%d') UTC"
            git pull --rebase
            git push
          fi
