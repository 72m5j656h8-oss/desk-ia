name: La tua sala - dai un ordine

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Su quale mercato"
        type: choice
        options: [BTC, NDX, EURUSD]
        default: BTC
      posizione:
        description: "LONG = guadagni se sale · SHORT = guadagni se scende · FLAT = chiudi e resta fermo"
        type: choice
        options: [LONG, SHORT, FLAT]
        default: LONG
      quota:
        description: "Quanta parte dei $10.000 di quel mercato usare"
        type: choice
        options: ["100", "75", "50", "25"]
        default: "100"
      nota:
        description: "Perché? (facoltativo, la rileggerai più avanti)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: desk-ia
  cancel-in-progress: false

jobs:
  ordine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registra l'ordine
        env:
          ASSET: ${{ github.event.inputs.asset }}
          POSIZIONE: ${{ github.event.inputs.posizione }}
          QUOTA: ${{ github.event.inputs.quota }}
          NOTA: ${{ github.event.inputs.nota }}
        run: node order.js

      - name: Aggiorna il desk
        run: node desk.js

      - name: Salva
        env:
          ASSET: ${{ github.event.inputs.asset }}
          POSIZIONE: ${{ github.event.inputs.posizione }}
        run: |
          git config user.name "desk-ia-bot"
          git config user.email "desk-ia-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "Ordine: $ASSET $POSIZIONE"
          git pull --rebase
          git push
