<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Pop; src: url(lib/Poppins-Bold.ttf); font-weight: 700; }
@font-face { font-family: PopR; src: url(carosello/Poppins-Regular.ttf); font-weight: 400; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1020; font-family: Pop, sans-serif; }
iframe { position: absolute; inset: 0; width: 1080px; height: 1920px; border: 0; }
#head { position: absolute; top: 70px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: center; }
#head .b { background: #F2A93B; color: #0b1020; font-size: 34px; padding: 8px 20px 10px; border-radius: 12px; box-shadow: 0 5px 0 #8a5a12; }
#head .m { color: #cfd6ea; font: 400 28px PopR; background: rgba(11,16,32,.75); padding: 8px 16px; border-radius: 10px; }
#panel { position: absolute; left: 40px; top: 170px; width: 1000px; height: 1000px; border-radius: 26px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 3px #26304f; background: #a0a0a0; }
#panel svg { width: 1000px; height: 1000px; display: block; }
#cap { position: absolute; left: 50px; right: 50px; top: 1210px; text-align: center; font-size: 72px; line-height: 1.12; color: #fff;
  -webkit-text-stroke: 3px #0b1020; paint-order: stroke fill; text-shadow: 0 5px 0 #0b1020, 0 0 18px rgba(0,0,0,.8); }
#cap .k { background: #F2A93B; color: #0b1020; -webkit-text-stroke: 0; text-shadow: none; padding: 0 14px 4px; border-radius: 14px; display: inline-block; transform: rotate(-2deg); box-shadow: 0 6px 0 #8a5a12; }
.lbl { font: 700 34px Pop; }
.card { position: absolute; left: 110px; right: 110px; top: 380px; background: rgba(11,16,32,.95); border: 3px solid #F2A93B; border-radius: 24px;
  padding: 28px 34px; color: #eef1f8; font: 700 46px Pop; display: grid; gap: 18px; opacity: 0; }
.card .t { font: 700 30px Pop; color: #F2A93B; letter-spacing: 1px; }
.card .g { color: #2fd08a; } .card .r { color: #ff5a6a; }
#wm { position: absolute; right: 190px; top: 186px; color: rgba(255,255,255,.85); font: 700 26px Pop; background: rgba(11,16,32,.6); padding: 6px 14px; border-radius: 10px; }
#hook { position: absolute; left: 0; right: 0; top: 360px; text-align: center; color: #fff; font: 700 130px/1.04 Pop; -webkit-text-stroke: 5px #0b1020; paint-order: stroke fill; text-shadow: 0 10px 0 #0b1020, 0 0 50px rgba(0,0,0,.9); }
#hook .r { color: #ff5a6a; }
#q { position: absolute; left: 0; right: 0; top: 360px; text-align: center; font: 700 210px/1 Pop; opacity: 0; -webkit-text-stroke: 7px #0b1020; paint-order: stroke fill; text-shadow: 0 12px 0 #0b1020, 0 0 60px rgba(0,0,0,.9); }
#q .y { color: #2fd08a; } #q .n { color: #ff5a6a; } #q .o { color: #fff; font-size: 110px; }
#follow { position: absolute; left: 0; right: 0; top: 960px; text-align: center; opacity: 0; }
#follow span { display: inline-block; background: #F2A93B; color: #0b1020; font: 700 50px Pop; padding: 14px 30px 18px; border-radius: 20px; box-shadow: 0 8px 0 #8a5a12; }
</style></head><body>
<iframe id="tr" src="trader.html?shot=pip&tl=reelT6/tl.json"></iframe>
<div id="head"><span class="b">ESITO</span><span class="m" id="date">NAS100 · 15m · 29 ott</span></div>
<div id="panel">
  <svg viewBox="0 0 1170 1170" preserveAspectRatio="xMidYMid slice">
    <defs><marker id="ar" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#ff5a6a"/></marker></defs>
    <g id="g_ieri"><image href="reelT6/ieri.png" x="0" y="0" width="1170" height="1170"/>
      <g id="s1" opacity="0" transform="translate(585 600) rotate(-10)">
        <rect x="-330" y="-110" width="660" height="220" rx="22" fill="rgba(11,16,32,.85)" stroke="#ff5a6a" stroke-width="14"/>
        <text x="0" y="15" text-anchor="middle" style="font:700 110px Pop" fill="#ff5a6a">STOP</text>
        <text x="0" y="82" text-anchor="middle" style="font:700 52px Pop" fill="#fff">29 ott · −1R</text></g></g>
    <g id="g_oggi" opacity="0"><image href="reelT6/oggi.png" x="0" y="0" width="1170" height="1170"/>
      <g id="s2" opacity="0" transform="translate(585 600) rotate(-10)">
        <rect x="-330" y="-110" width="660" height="220" rx="22" fill="rgba(11,16,32,.85)" stroke="#ff5a6a" stroke-width="14"/>
        <text x="0" y="15" text-anchor="middle" style="font:700 110px Pop" fill="#ff5a6a">STOP</text>
        <text x="0" y="82" text-anchor="middle" style="font:700 52px Pop" fill="#fff">30 ott · −1R</text></g>
      <g id="dn" opacity="0"><path d="M 120 120 L 700 1040" stroke="#ff5a6a" stroke-width="16" stroke-linecap="round" marker-end="url(#ar)"/>
        <rect x="460" y="150" width="440" height="80" rx="14" fill="#ff5a6a"/><text x="680" y="207" text-anchor="middle" style="font:700 52px Pop" fill="#fff">NASDAQ −2,6%</text></g>
      <g id="lg" opacity="0"><rect x="560" y="420" width="190" height="58" rx="12" fill="#2fd08a"/><text x="655" y="461" text-anchor="middle" class="lbl" fill="#0b1020">LONG ▲</text></g>
    </g>
  </svg>
</div>
<div class="card" id="c_dati"><div class="t">HO SBAGLIATO?</div><div><span class="g">✓</span> regole rispettate</div><div>📓 nel diario: long contro trend</div></div>
<div class="card" id="c_rr"><div class="t">RISCHIO / RENDIMENTO 1:2</div><div><span class="r">−1 −1 = −2R</span></div><div><span class="g">+2R</span> con 1 trade vinto</div><div>= <span class="g">pari</span></div></div>
<div class="card" id="c_week"><div class="t">QUESTA SETTIMANA</div><div>Conto: <span class="r">−2R</span></div><div>📊 Report domenica · 17:00</div></div>
<div id="wm">@contozero.trading</div>
<div id="follow"><span>SEGUI per il report di domenica</span></div>
<div id="q"><div><span class="y">SÌ</span><span class="o"> o </span><span class="n">NO</span></div></div>
<div id="cap"></div>
<div id="hook"><div>2 GIORNI</div><div class="r">2 STOP ❌❌</div></div>
<script>
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
let TL, T = 0;
const $ = id => document.getElementById(id);
function fade(id, t0, t1 = 99) { const a = Math.min(clamp((T - t0) / 0.35), clamp((t1 - T) / 0.3)); $(id).setAttribute('opacity', a); return a; }
function fadeD(id, t0, t1 = 99) { const a = Math.min(clamp((T - t0) / 0.3), clamp((t1 - T) / 0.3)); $(id).style.opacity = a; return a; }
function stamp(id, t0, t1) { const a = Math.min(clamp((T - t0) / 0.18), clamp((t1 - T) / 0.3)); $(id).setAttribute('opacity', a); $(id).setAttribute('transform', `translate(585 600) rotate(-10) scale(${1.6 - 0.6 * ease(a)})`); }
window.renderAt = function (t) {
  T = t; const E = TL.events, s = i => E[i].start, e = i => E[i].end;
  $('tr').contentWindow.renderAt(t);
  $('hook').style.opacity = t < e(0) + 0.2 ? 1 : clamp(1 - (t - e(0) - 0.2) / 0.3);
  stamp('s1', s(1) + 0.3, s(1) + 1.6);
  const sw = s(1) + 1.6, go = clamp((t - sw) / 0.4);
  $('g_oggi').setAttribute('opacity', go); $('g_ieri').setAttribute('opacity', 1 - go);
  const dt = t > sw ? 'NAS100 · 15m · 30 ott' : 'NAS100 · 15m · 29 ott'; if ($('date').textContent !== dt) $('date').textContent = dt;
  stamp('s2', e(1) - 1.0, s(2) + 0.3);
  fade('dn', s(2) + 0.4, s(3) + 0.2);
  fade('lg', s(2) + 2.4, s(3) + 0.2);
  fadeD('c_dati', s(3) + 1.0, s(4) + 0.1);
  fadeD('c_rr', s(4) + 0.3, s(5) + 0.1);
  fadeD('c_week', s(5) + 0.3, s(6) + 0.2);
  const qa = clamp((t - s(6) - 1.6) / 0.25); $('q').style.opacity = qa;
  $('q').style.transform = `scale(${qa ? 1 + 0.04 * Math.sin(t * 6) : 1})`;
  fadeD('follow', s(6) + 0.3);
  const cur = E.find(x => t >= x.start && t <= x.end + 0.15); let html = '';
  if (cur) {
    const words = cur.text.split(' '), chunks = []; let c = [];
    for (const w of words) { c.push(w); if (c.join(' ').length > 16 || (/[.,!?…:]$/.test(w) && c.length > 1)) { chunks.push(c); c = []; } }
    if (c.length) chunks.push(c);
    const tot = cur.text.length; let acc = 0; const u = (t - cur.start) / (cur.end - cur.start); let pick = chunks[chunks.length - 1];
    for (const ch of chunks) { acc += ch.join(' ').length + 1; if (u < acc / tot) { pick = ch; break; } }
    html = pick.map(w => w === cur.key ? `<span class="k">${w}</span>` : w).join(' ');
  }
  if ($('cap').innerHTML !== html) $('cap').innerHTML = html;
};
(async () => {
  TL = await (await fetch('reelT6/tl.json')).json();
  await new Promise(r => { const f = $('tr'); const chk = () => (f.contentWindow && f.contentWindow.READY) ? r() : setTimeout(chk, 100); chk(); });
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body></html>
