<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Pop; src: url(lib/Poppins-Bold.ttf); font-weight: 700; }
@font-face { font-family: PopR; src: url(carosello/Poppins-Regular.ttf); font-weight: 400; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1020; font-family: Pop, sans-serif; }
iframe { position: absolute; inset: 0; width: 1080px; height: 1920px; border: 0; }
#head { position: absolute; top: 70px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: center; }
#head .b { background: #F2A93B; color: #0b1020; font-size: 34px; padding: 8px 20px 10px; border-radius: 12px; box-shadow: 0 5px 0 #8a5a12; }
#head .m { color: #cfd6ea; font: 400 28px PopR; background: rgba(11,16,32,.75); padding: 8px 16px; border-radius: 10px; }
#panel { position: absolute; left: 40px; top: 170px; width: 1000px; height: 1000px; border-radius: 26px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 3px #26304f; background: #9a9a9a; }
#panel svg { width: 1000px; height: 1000px; display: block; }
#cap { position: absolute; left: 50px; right: 50px; top: 1210px; text-align: center; font-size: 72px; line-height: 1.12; color: #fff;
  -webkit-text-stroke: 3px #0b1020; paint-order: stroke fill; text-shadow: 0 5px 0 #0b1020, 0 0 18px rgba(0,0,0,.8); }
#cap .k { background: #F2A93B; color: #0b1020; -webkit-text-stroke: 0; text-shadow: none; padding: 0 14px 4px; border-radius: 14px; display: inline-block; transform: rotate(-2deg); box-shadow: 0 6px 0 #8a5a12; }
.lbl { font: 700 34px Pop; }
#news { position: absolute; left: 120px; right: 120px; top: 300px; background: rgba(11,16,32,.95); border: 3px solid #F2A93B; border-radius: 24px;
  padding: 26px 34px; color: #eef1f8; display: grid; gap: 14px; opacity: 0; }
#news .t { font: 700 30px Pop; color: #F2A93B; letter-spacing: 1px; }
#news .r { display: flex; justify-content: space-between; font: 700 44px Pop; }
#news .r b { color: #2fd08a; } #news small { font: 400 30px PopR; color: #9aa4c2; }
#wait { position: absolute; left: 0; right: 0; top: 720px; text-align: center; opacity: 0; }
#wait span { display: inline-block; background: rgba(11,16,32,.93); color: #fff; font: 700 46px Pop; padding: 18px 34px; border-radius: 20px; border: 3px solid #26304f; }
#open { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; opacity: 0; }
#open span { display: inline-block; background: #0b1020; color: #F2A93B; font: 700 34px Pop; padding: 10px 24px 12px; border-radius: 14px; border: 3px solid #F2A93B; }
#hook { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #fff; font: 700 112px/1.04 Pop; -webkit-text-stroke: 5px #0b1020; paint-order: stroke fill; text-shadow: 0 10px 0 #0b1020, 0 0 50px rgba(0,0,0,.9); }
#hook span { color: #F2A93B; } #hook .g { color: #2fd08a; }
#q { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font: 700 210px/1 Pop; opacity: 0; -webkit-text-stroke: 7px #0b1020; paint-order: stroke fill; text-shadow: 0 12px 0 #0b1020, 0 0 60px rgba(0,0,0,.9); }
#q .y { color: #2fd08a; } #q .n { color: #ff5a6a; } #q .o { color: #fff; font-size: 110px; }
</style></head><body>
<iframe id="tr" src="trader.html?shot=pip&tl=reelT4/tl.json"></iframe>
<div id="head"><span class="b">TRADE DEL GIORNO</span><span class="m">NAS100 · 15m · 29 ott</span></div>
<div id="panel">
  <svg viewBox="0 0 1170 1170" preserveAspectRatio="xMidYMid slice">
    <image href="reelT4/crop.png" x="0" y="0" width="1170" height="1170"/>
    <rect id="cover" x="0" y="0" width="956" height="1170" fill="#9a9a9a"/>
    <defs>
      <marker id="ar" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#ff5a6a"/></marker>
    </defs>
    <g id="asia" opacity="0"><rect x="48" y="96" width="408" height="836" fill="none" stroke="#F2A93B" stroke-width="7" stroke-dasharray="18 10" rx="6"/>
      <rect x="60" y="110" width="150" height="54" rx="10" fill="#F2A93B"/><text x="135" y="149" text-anchor="middle" class="lbl" fill="#0b1020">ASIA</text>
      <line x1="48" x2="956" y1="932" y2="932" stroke="#F2A93B" stroke-width="6" stroke-dasharray="16 10"/>
      <rect x="60" y="950" width="260" height="54" rx="10" fill="#F2A93B"/><text x="190" y="989" text-anchor="middle" class="lbl" fill="#0b1020">minimi Asia</text></g>
    <g id="news13" opacity="0"><line x1="702" x2="702" y1="0" y2="1170" stroke="#5b8cff" stroke-width="6"/>
      <rect x="430" y="40" width="262" height="56" rx="10" fill="#5b8cff"/><text x="561" y="80" text-anchor="middle" class="lbl" fill="#fff">13:30 DATI USA</text></g>
    <g id="flat" opacity="0"><rect x="640" y="300" width="110" height="420" fill="rgba(11,16,32,.10)" stroke="#0b1020" stroke-width="5" stroke-dasharray="14 9" rx="6"/>
      <rect x="470" y="740" width="200" height="56" rx="10" fill="#0b1020"/><text x="570" y="780" text-anchor="middle" class="lbl" fill="#fff">FERMO</text></g>
    <g id="ws" opacity="0"><line x1="745" x2="745" y1="0" y2="1170" stroke="#2fd08a" stroke-width="6"/>
      <rect x="610" y="120" width="330" height="56" rx="10" fill="#2fd08a"/><text x="775" y="160" text-anchor="middle" class="lbl" fill="#0b1020">14:30 WALL STREET</text></g>
    <g id="drop" opacity="0"><path d="M 820 330 L 820 960" stroke="#ff5a6a" stroke-width="12" stroke-linecap="round" marker-end="url(#ar)"/></g>
    <g id="sweep" opacity="0"><circle cx="747" cy="1060" r="95" fill="none" stroke="#ff5a6a" stroke-width="10"/>
      <rect x="380" y="1060" width="250" height="56" rx="10" fill="#ff5a6a"/><text x="505" y="1100" text-anchor="middle" class="lbl" fill="#fff">PRESI!</text></g>
    <g id="stamp" opacity="0" transform="translate(585 520) rotate(-10)">
      <rect x="-430" y="-125" width="860" height="250" rx="22" fill="rgba(11,16,32,.85)" stroke="#2fd08a" stroke-width="14"/>
      <text x="0" y="15" text-anchor="middle" style="font:700 112px Pop;letter-spacing:3px" fill="#2fd08a">SONO DENTRO</text>
      <text x="0" y="90" text-anchor="middle" style="font:700 56px Pop" fill="#fff">LONG ▲</text></g>
    <g id="qm" opacity="0"><text x="870" y="640" text-anchor="middle" style="font:700 260px Pop" fill="#F2A93B" stroke="#0b1020" stroke-width="8" paint-order="stroke">?</text>
      <rect x="640" y="700" width="330" height="60" rx="12" fill="#0b1020"/><text x="805" y="742" text-anchor="middle" class="lbl" fill="#F2A93B">ESITO DOMANI</text></g>
  </svg>
</div>
<div id="news"><div class="t">DATI USA · ORE 13:30</div>
  <div class="r">PIL Q3 <b>3,4%</b></div><small>atteso 3,2%</small>
  <div class="r">Core PCE <span>0,3%</span></div><small>in linea con le attese</small></div>
<div id="wait"><span id="waittx">⏳ aspetto la mia conferma</span></div>
<div id="open"><span>posizione aperta · non è un segnale</span></div>
<div id="q"><div><span class="y">SÌ</span><span class="o"> o </span><span class="n">NO</span></div></div>
<div id="cap"></div>
<div id="hook"><div>3 GIORNI</div><div><span>ZERO TRADE</span></div><div class="g">OGGI SONO ENTRATO</div></div>
<script>
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
let TL, T = 0;
const $ = id => document.getElementById(id);
function fade(id, t0, t1 = 99) { const a = Math.min(clamp((T - t0) / 0.35), clamp((t1 - T) / 0.3)); $(id).setAttribute('opacity', a); return a; }
function fadeD(id, t0, t1 = 99) { const a = Math.min(clamp((T - t0) / 0.3), clamp((t1 - T) / 0.3)); $(id).style.opacity = a; return a; }
window.renderAt = function (t) {
  T = t; const E = TL.events, s = i => E[i].start, e = i => E[i].end;
  $('tr').contentWindow.renderAt(t);
  $('hook').style.opacity = t < e(0) - 0.2 ? 1 : clamp(1 - (t - e(0) + 0.2) / 0.35);
  let rx;
  if (t < s(1)) rx = 456 * ease((t - 1.0) / 2.4);
  else if (t < s(3)) rx = 456 + 284 * ease((t - s(1)) / 2.5);
  else if (t < s(6)) rx = 740 + 50 * ease((t - s(3) - 0.6) / 1.5);
  else rx = 790 + 166 * ease((t - s(6)) / 1.2);
  $('cover').setAttribute('x', rx); $('cover').setAttribute('width', Math.max(0, 956 - rx));
  fade('asia', 1.2);
  fadeD('news', s(1) + 0.5, s(2) + 0.2);
  fade('news13', s(2), s(4));
  fade('flat', s(2) + 0.9, s(3) + 0.4);
  fade('ws', s(3) + 0.3, s(5));
  fade('drop', s(3) + 1.2, s(4) + 0.4);
  const sw = fade('sweep', s(3) + 2.8, s(6));
  $('sweep').setAttribute('transform', `translate(747 1060) scale(${t > s(4) && t < e(4) ? 1 + 0.08 * Math.sin((t - s(4)) * 9) : 1}) translate(-747 -1060)`);
  const w = fadeD('wait', s(5) + 0.9, s(6) + 0.15);
  $('waittx').textContent = '⏳ aspetto la mia conferma' + '.'.repeat(Math.floor(t * 3) % 4);
  const st = Math.min(clamp((t - (s(6) + 0.3)) / 0.18), clamp((s(7) + 0.2 - t) / 0.3)); $('stamp').setAttribute('opacity', st);
  $('stamp').setAttribute('transform', `translate(585 520) rotate(-10) scale(${1.6 - 0.6 * ease(st)})`);
  fadeD('open', s(6) + 0.5);
  fade('qm', s(7) + 0.3);
  const qa = clamp((t - s(8) - 0.9) / 0.25); $('q').style.opacity = qa;
  $('q').style.transform = `scale(${qa ? 1 + 0.04 * Math.sin(t * 6) : 1})`;
  const cur = E.find(x => t >= x.start && t <= x.end + 0.15); let html = '';
  if (cur) {
    const words = cur.text.split(' '), chunks = []; let c = [];
    for (const w of words) { c.push(w); if (c.join(' ').length > 16 || (/[.,!?…:]$/.test(w) && c.length > 1)) { chunks.push(c); c = []; } }
    if (c.length) chunks.push(c);
    const tot = cur.text.length; let acc = 0; const u = (t - cur.start) / (cur.end - cur.start); let pick = chunks[chunks.length - 1];
    for (const ch of chunks) { acc += ch.join(' ').length + 1; if (u < acc / tot) { pick = ch; break; } }
    html = pick.map(w => w === cur.key ? `<span class="k">${w}</span>` : w).join(' ');
  }
  if ($('cap').innerHTML !== html) $('cap').innerHTML = html;
};
(async () => {
  TL = await (await fetch('reelT4/tl.json')).json();
  await new Promise(r => { const f = $('tr'); const chk = () => (f.contentWindow && f.contentWindow.READY) ? r() : setTimeout(chk, 100); chk(); });
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body></html>
